<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Florencia Taravella">
    <title>Contact InciScope</title>
    <meta name="description" content="InciScope is a chemical compound explorer that retrieves molecular properties, descriptions, and structural information from PubChem and Wikipedia APIs.">


    <link rel="stylesheet" href="/css/contact-base.css">
    <link rel="stylesheet" href="/css/contact-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    
    <link rel="icon" href="/images/favicon.png">

    <meta property="og:title" content="Contact InciScope">
    <meta property="og:image" content="https://inciscope.onrender.com/images/InciScope.png">
    <meta property="og:type" content="website">
    <meta name="description" content="Contact the developer of InciScope with questions, suggestions, or requests for information about chemical compounds and the application.">
    <meta property="og:url" content="https://inciscope.onrender.com/contact.html">
</head>
<body>
    <header id="ajaxHeader"></header>
    <main>
        
    <form id="myForm" method="get" class="contactForm">
       
        <fieldset id="contactInfo">
            <legend> Personal information </legend>
            <label for="fname">Name <input type="text" name="fname" required
  title="Please enter letters only." autocomplete="given-name" id="fname"> </label>
            <label for="lname">Last name <input type="text" name="lname" required
  title="Please enter letters only." autocomplete="family-name" id="lname"> </label>
            <label for="email">e-mail <input type="email" name="email" placeholder="example@email.com" required autocomplete="email" id="email"> </label>
            <label for="phone">Phone <input type="tel" name="phone" id="phone"> </label>
            <label for="website">Website <input type="text" name="website" id="website" autocomplete="url"> </label>
        </fieldset>
        <fieldset id="interest">
            <legend> Interest</legend>
            <label for="compoundInfo"> Compound information
            <input type="radio" name="interest" value="compound information" id="compoundInfo"></label>
            <label for="supplierInfo"> Supplier information<input type="radio" name="interest" value="supplier information" id="supplierInfo"></label>
            <label for="formInfo"> Formulation information <input type="radio" name="interest" value="formulation interest" id="formInfo"></label>
            
          <div class="textarea">
            <label for="interests"> Interests<span>(Optional)</span></label><textarea rows="5" name="interests" id="interests" title="Write your prefences, interests, concerns, etc..."></textarea>
        </div>
            <input id="submitBtn" type="submit" value="Contact InciScope">
    </form>
    <div id="thankyou" ></div>
    </main>

   <footer id="ajaxFooter"></footer>
   <script type="module" src="/scripts/contact.js"></script>
</body>

</html>
