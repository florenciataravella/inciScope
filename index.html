<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Florencia Taravella">
    <title>InciScope | Chemical Compound Explorer</title>
    <meta name="description" content="InciScope is a chemical compound explorer that retrieves molecular properties, descriptions, and structural information from PubChem and Wikipedia APIs.">

    

    <link rel="icon" href="images/favicon.ico">

    <meta property="og:title" content="InciScope - Chemical Compound Explorer">
    <meta property="og:description" content="Search chemical compounds and discover molecular properties, IUPAC names, formulas, descriptions, and chemical structures using data from PubChem and Wikipedia.">
    <meta property="og:image" content="https://inciscope.onrender.com/images/InciScope.png">
    <meta property="og:url" content="https://inciscope.onrender.com/">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="/css/index-base.css">
    <link rel="stylesheet" href="/css/index-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <header id="ajaxHeader"></header>
    <main>
   
   
   
    <section class="compound-details">
      <h1> Search chemical compounds and discover molecular properties </h1>
       <div id="spinner" class="hidden"></div>
         <div id="compound-pubChemDetails"></div>
          <section class="description">
          <div id="compound-wikiDetails"></div>
          <div id="compound-image"></div>
          </section>
    </section>
    
  <div id="clearDiv"> <button id="clearButton" aria-label="clear description button">Clear</button></div>
   <dialog id="myModal">
    <p> Could not find your search, please enter another compound. Do not use special characters in your search.</p>
    <button id="closeModal" aria-label="close modal button"> X </button>
    </dialog>
   <dialog id="visits">
    <p id="n-visits"></p>
    <button id="closeModal" aria-label="close modal button">x</button>
    </dialog>
    </main>
   <footer id="ajaxFooter"></footer>
   
   <script type="module" src="/scripts/main.js"></script>
   

</body>
</html>
