<body>
    <header id="ajaxHeader"></header>
    <main>
        <h3> Contact InciScope</h3>
    <form id="myForm" method="get" class="contactForm">
        <fieldset id="contactInfo">
            <legend> Personal information </legend>
            <label for="fname">Name <input type="text" name="fname" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
  title="Please enter letters only." autocomplete="given-name"> </label>
            <label for="lname">Last name <input type="text" name="lname" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+"
  title="Please enter letters only." autocomplete="family-name"> </label>
            <label for="email">e-mail <input type="email" name="email" placeholder="example@email.com" required autocomplete="email"> </label>
            <label for="phone">Phone <input type="tel" name="phone" pattern="[\+]?[0-9\s\-\(\)]{8,20}"> </label>
            <label for="website">Website <input type="text" name="website"> </label>
        </fieldset>
        <fieldset id="interest">
            <legend> Interest</legend>
            <label for="interest"> Compound information
            <input type="radio" name="interest" value="compound information"></label>
            <label for="interest"> Supplier information<input type="radio" name="interest" value="supplier information"></label>
            <label for="interest"> Formulation information <input type="radio" name="interest" value="formulation interest"></label>
            
          <div class="textarea">
            <label for="interests"> Interests<span>(Optional)</span></label><textarea rows="5" name="interests" id="interests" title="Write your prefences, interests, concerns, etc..."></textarea>
        </div>
            <input id="submitBtn" type="submit" value="Contact InciScope">
    </form>
    <div id="thankyou" ></div>
    </main>
